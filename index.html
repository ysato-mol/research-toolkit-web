<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Research Toolkit Structure Viewer</title>
    <link rel="stylesheet" href="app.css?v=20261002-projection-toggle">
  </head>
  <body>
    <header class="app-header">
      <div class="tool-header">
        <div class="tool-heading">
          <div class="tool-title-row"><a id="toolkitHome" class="home-hex-button" hidden aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path><path d="M9.5 20v-6h5v6"></path></svg></a><h1>Structure Viewer</h1></div>
          <nav class="tool-switcher" hidden aria-label="Tool navigation"></nav>
        </div>
        <div id="standaloneSettings" class="standalone-settings"><button id="viewerTheme" type="button" aria-label="Switch theme">◐</button><select id="viewerLanguage" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></div>
      </div>
    </header>
    <main class="viewer-shell page-shell">
      <div class="workspace-bar">
        <nav id="workspaceTabs" class="workspace-tabs" role="tablist" aria-label="Open structures"></nav>
        <div class="workspace-actions">
          <label class="comparison-select" hidden><span class="sr-only">Comparison Viewer</span><select id="secondaryViewerSelect" aria-label="Comparison Viewer"></select></label>
          <button id="compareViewerButton" type="button" class="workspace-action" title="Compare two Viewers" aria-label="Compare Viewers" aria-pressed="false">▥</button>
          <button id="duplicateViewerButton" type="button" class="workspace-action" title="Duplicate active Viewer" aria-label="Duplicate Viewer">⧉</button>
          <button id="newViewerButton" type="button" class="workspace-action" title="Open an empty Viewer" aria-label="New Viewer">+</button>
        </div>
      </div>

      <div class="viewer-workspace">
        <section class="panel viewer-panel">
          <div class="viewer-tool-strip" aria-label="Viewer controls">
            <button id="openButton" type="button" class="outlined-action secondary">Open</button>
            <input id="fileInput" type="file" accept=".xyz,.mol,.sdf,.pdb,.ent,.cif,.mmcif,chemical/x-xyz,chemical/x-mdl-molfile,chemical/x-mdl-sdfile,chemical/x-pdb,chemical/x-cif,text/plain" multiple hidden>
            <label class="style-control"><span class="sr-only">Molecule style</span><select id="styleSelect"><option value="ball-stick">ball &amp; stick</option><option value="stick">stick</option><option value="spacefill">spacefill</option></select></label>
            <button id="labelsButton" type="button" class="tonal-action" aria-pressed="false">Labels</button>
            <button id="clearButton" type="button" class="outlined-action secondary">Clear selection</button>
            <button id="resetButton" type="button" class="outlined-action secondary">Reset view</button>
            <button id="copyCoordinatesButton" type="button" class="primary-action">Copy coordinates</button>
            <button id="pngButton" type="button" class="outlined-action secondary">PNG</button>
            <button id="shareButton" type="button" class="outlined-action secondary">Share</button>
            <button id="openDetachedButton" type="button" class="outlined-action secondary">Open in New Window</button>
          </div>
      <section id="viewerStage" class="viewer-stage" aria-label="Molecular structure viewer">
        <div id="viewer" class="viewer"><p>Open or drop XYZ, MOL, SDF, PDB, CIF, or mmCIF structures.</p></div>
            <output id="measurementOverlay" class="measurement-overlay" aria-live="polite" hidden></output>
        <output id="statusMessage" class="status-message" aria-live="polite" hidden></output>
        <span class="resize-affordance" aria-hidden="true"></span>
      </section>

        </section>
        <aside class="panel viewer-sidebar" aria-label="Display and measurements">
          <h2 data-viewer-text="Viewer settings">Viewer settings</h2>
          <div class="sidebar-tabs" role="tablist" aria-label="Viewer settings">
            <button id="crystalTab" role="tab" aria-controls="crystalPage" data-sidebar-tab="crystal" aria-selected="false" data-viewer-text="Crystal" tabindex="-1" hidden>Crystal</button>
            <button id="crystalInformationTab" role="tab" aria-controls="crystalInformationPage" data-sidebar-tab="crystal-information" aria-selected="false" data-viewer-text="Crystal information" tabindex="-1" hidden>Crystal information</button>
            <button id="infoTab" role="tab" aria-controls="infoPage" data-sidebar-tab="info" aria-selected="true" data-viewer-text="Info / XYZ">Info / XYZ</button>
          </div>
          <section id="crystalPage" role="tabpanel" aria-labelledby="crystalTab" data-sidebar-page="crystal" hidden><section id="crystalPanelHost" class="crystal-panel-host" aria-label="Crystal settings" hidden></section></section>
          <section id="crystalInformationPage" role="tabpanel" aria-labelledby="crystalInformationTab" data-sidebar-page="crystal-information" hidden><section id="crystalInformationHost"></section></section>
          <section id="infoPage" role="tabpanel" aria-labelledby="infoTab" data-sidebar-page="info">
            <label class="model-control" hidden><span class="sr-only">Structure model</span><select id="modelSelect" aria-label="Structure model"></select></label>
            <h3 data-viewer-text="Selected atoms">Selected atoms</h3><output id="selectionSummary">—</output>
            <output id="structureSummary" class="summary"></output>
            <div class="coordinate-actions"><button id="showXyzButton" type="button" class="outlined-action secondary" aria-expanded="false">Show XYZ</button><button id="exportXyzButton" type="button" class="outlined-action secondary">Export XYZ</button></div>
            <p id="lossyNotice" class="lossy-notice" hidden></p>
            <details id="xyzPanel" class="xyz-panel"><summary data-viewer-text="Full XYZ">Full XYZ</summary><textarea id="xyzText" readonly spellcheck="false"></textarea></details>
          </section>
        </aside>
      </div>
      <p id="errorMessage" class="error-message" role="alert" aria-live="assertive" hidden></p>
    </main>
    <script src="vendor/3Dmol-2.5.3.min.js"></script>
    <script src="vendor/openchemlib-9.18.2.min.js"></script>
    <script src="vendor/molstar-cif-parser.js"></script>
    <script src="dist/structure-viewer.bundle.js?v=20261002-projection-toggle"></script>
    <script src="app.js?v=20261002-projection-toggle"></script>
  </body>
</html>
